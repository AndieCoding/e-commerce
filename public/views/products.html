<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Productos - El fan del Mate</title>
    <link rel="icon" type="image/x-icon" href="/img/icons/favicon.png">
    <link rel="stylesheet" href="/css/front.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Roboto+Condensed:ital,wght@0,100..900;1,100..900&family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap"
        rel="stylesheet">
    <script type="module" src="/js/front/app.js"></script>
</head>

<body>

    <menu-del-mate></menu-del-mate>

    <header class="productos">
        <section class="categorias product-card">

            <circulo-categoria img="/img/categorias/mates.png" name="Mates"></circulo-categoria>
            <circulo-categoria img="/img/categorias/termos.png" name="termos"></circulo-categoria>
            <circulo-categoria img="/img/categorias/yerbas.png" name="yerbas"></circulo-categoria>

        </section>
    </header>
    <section id="tipo-vista-contenedor" class="filtros-vista-contenedor">
        <div class="contenedor-boton-filtro" id="boton-filtro">
            <span>Filtrar</span>
            <svg class="filtrar-icon" xmlns="http://www.w3.org/2000/svg" width="32" height="32" fill="#000000"
                viewBox="0 0 256 256">
                <path
                    d="M176,80a8,8,0,0,1,8-8h32a8,8,0,0,1,0,16H184A8,8,0,0,1,176,80ZM40,88H144v16a8,8,0,0,0,16,0V56a8,8,0,0,0-16,0V72H40a8,8,0,0,0,0,16Zm176,80H120a8,8,0,0,0,0,16h96a8,8,0,0,0,0-16ZM88,144a8,8,0,0,0-8,8v16H40a8,8,0,0,0,0,16H80v16a8,8,0,0,0,16,0V152A8,8,0,0,0,88,144Z">
                </path>
            </svg>
        </div>
        <div class="contenedor-boton-vista">
            <svg id="grid" class="tipo-vista-icon" xmlns="http://www.w3.org/2000/svg" width="32" height="32"
                fill="#000000" viewBox="0 0 256 256">
                <path
                    d="M200,40H56A16,16,0,0,0,40,56V200a16,16,0,0,0,16,16H200a16,16,0,0,0,16-16V56A16,16,0,0,0,200,40Zm0,80H136V56h64ZM120,56v64H56V56ZM56,136h64v64H56Zm144,64H136V136h64v64Z">
                </path>
            </svg>
            <svg id="list" class="tipo-vista-icon" xmlns="http://www.w3.org/2000/svg" width="32" height="32"
                fill="#000000" viewBox="0 0 256 256">
                <path
                    d="M224,128a8,8,0,0,1-8,8H40a8,8,0,0,1,0-16H216A8,8,0,0,1,224,128ZM40,72H216a8,8,0,0,0,0-16H40a8,8,0,0,0,0,16ZM216,184H40a8,8,0,0,0,0,16H216a8,8,0,0,0,0-16Z">
                </path>
            </svg>
        </div>
    </section>
    <main>
        <div class="busquedas">
            <aside>

                <div class="filtros">
                    <filtros-del-mate></filtros-del-mate>
                </div>
            </aside>
            <div class="resultados grid">
            </div>
        </div>
    </main>

    <footer>
        <footer-del-mate></footer-del-mate>
    </footer>

    <mobile-nav-bar></mobile-nav-bar>
</body>

</html>
