<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="UTF-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1.0" />
	<title>Alta de productos</title>
	<link rel="icon" type="image/x-icon" href="/img/icons/favicon.png">
	<link rel="stylesheet" href="/css/ficha-de-stock.css" />
	<link rel="stylesheet" href="/css/admin.css" />
	<link
		href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Roboto+Condensed:ital,wght@0,100..900;1,100..900&display=swap"
		rel="stylesheet">
	<script type="module" src="/js/front/app.js"></script>
	<script type="module" src="../../js/altas.js"></script>
</head>

<body>
	<menu-del-mate></menu-del-mate>
	<div class="main admin">
		<admin-nav></admin-nav>
		<div class="admin-container">
			<div class="admin-header">
				<h1>Alta de Productos</h1>
			</div>
			<form autocomplete="off" class="form-alta-producto shadow-lg" id="nfacturaForm">

				<div class="form-section">
					<div class="input-group">
						<label for="tipo">Tipo de Producto</label>
						<select name="tipo" id="tipo" required>
							<option value="" disabled selected>Seleccionar...</option>
							<option value="mate">Mate</option>
							<option value="termo">Termo</option>
							<option value="yerba">Yerba</option>
						</select>
					</div>

					<div class="input-group">
						<label for="nombre">Nombre</label>
						<input type="text" name="nombre" id="nombre" placeholder="Ej: Camionero Alpaca" required>
					</div>

					<div class="input-group">
						<label for="marca">Marca</label>
						<input type="text" name="marca" id="marca" placeholder="Ej: Fan del Mate" required>
					</div>
				</div>

				<div class="form-section">
					<div class="input-group">
						<label for="precio">Precio</label>
						<input type="number" name="precio" id="precio" placeholder="Ej: 15000" required>
					</div>

					<div class="input-group">
						<label for="oferta">Precio de Oferta (Opcional)</label>
						<input type="number" name="oferta" id="oferta" placeholder="Ej: 12000">
					</div>

					<div class="input-group">
						<label for="stock">Stock Inicial</label>
						<input type="number" name="stock" id="stock" placeholder="Ej: 20" required>
					</div>
				</div>

				<div class="form-section">
					<div class="input-group full-width">
						<label for="descripcion">Descripción</label>
						<textarea name="descripcion" id="descripcion" rows="4"
							placeholder="Detalles del producto..."></textarea>
					</div>
				</div>

				<div class="form-section upload-section">
					<label for="imagen" class="upload-label">
						<span id="upload-text">Subir Imagen</span>
						<img id="image-preview" class="hidden" alt="Vista previa">
					</label>
					<input type="file" name="imagen" id="imagen" accept="image/*" required>
				</div>

				<div class="form-actions flex column align-center">
					<div class="guardar"></div>
					<button type="button" class="formButton enviar" disabled>Guardar Producto</button>
				</div>
			</form>

		</div>
	</div>
	<footer-del-mate></footer-del-mate>
	<admin-mobile-nav-bar></admin-mobile-nav-bar>

	<script>
	</script>
</body>

</html>
