<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Administrar Productos</title>
    <link rel="icon" type="image/x-icon" href="/img/icons/favicon.png">
    <link rel="stylesheet" href="/css/admin.css">
    <link
        href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Roboto+Condensed:ital,wght@0,100..900;1,100..900&display=swap"
        rel="stylesheet">
    <script type="module" src="/js/front/app.js"></script>
</head>

<body>
    <menu-del-mate></menu-del-mate>

    <div class="main admin">
        <admin-nav></admin-nav>

        <div class="admin-container">
            <div class="admin-header">
                <h1>Administrar Productos</h1>
                <!--<a href="/altas" class="btn btn-primary">Agregar producto</a>-->
            </div>

            <div class="admin-filters-container">
                <div class="filters-row">
                    <div class="search-box">
                        <input type="text" id="filter-product" placeholder="Buscar por nombre o ID de producto...">
                    </div>

                    <div class="select-group">
                        <select id="filter-category">
                            <option value="all">Todas las categorías</option>
                            <option value="General">General</option>
                        </select>

                        <select id="filter-stock">
                            <option value="all">Todo el stock</option>
                            <option value="low">Stock bajo (menos de 5)</option>
                            <option value="out">Sin stock (0)</option>
                        </select>
                    </div>
                </div>

                <div class="results-info">
                    Mostrando <span id="product-count">0</span> productos
                </div>
            </div>

            <div id="productList">
            </div>

            <div id="productList" class="product-list">
                <div class="loading">Cargando productos...</div>
            </div>
        </div>
    </div>

    <footer-del-mate></footer-del-mate>
    <admin-mobile-nav-bar></admin-mobile-nav-bar>
</body>

</html>
