<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Contacto - Fan del Mate</title>
    <link rel="icon" type="image/x-icon" href="/img/icons/favicon.png">
    <link rel="stylesheet" href="/css/front.css">
    <link rel="stylesheet" href="/css/contacto.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&family=Roboto+Condensed:wght@300;400;700&display=swap"
        rel="stylesheet">
    <script type="module" src="/js/dependencias.js"></script>
    <script type="module" src="/js/turbo.js"></script>
</head>

<body>
    <header>
        <menu-del-mate></menu-del-mate>
    </header>

    <main class="contacto-page">
        <div class="container">
            <section class="contacto-portada">
                <h1>Contáctanos</h1>
                <p>Respondemos tus dudas y escuchamos tus sugerencias.</p>
            </section>
        </div>

        <div class="container contacto-contenedor">
            <div class="contacto-info">
                <h2>Información de Contacto</h2>
                <div class="item-info">
                    <span class="icon">📍</span>
                    <p>El fan del Mate, Venado Tuerto, Argentina</p>
                </div>
                <div class="item-info">
                    <span class="icon">📧</span>
                    <p>fgcodear@gmail.com</p>
                </div>
                <div class="redes-sociales">
                    <a href="#" class="icono-social">Instagram</a>
                    <a href="#" class="icono-social">Facebook</a>
                </div>
            </div>

            <div class="contacto-formulario-contenedor">
                <form id="formularioContacto">
                    <div class="grupo-formulario">
                        <label for="nombre">Nombre Completo</label>
                        <input type="text" id="nombre" name="nombre" required placeholder="Tu nombre">
                    </div>
                    <div class="grupo-formulario">
                        <label for="email">Correo Electrónico</label>
                        <input type="email" id="email" name="email" required placeholder="tu@email.com">
                    </div>
                    <div class="grupo-formulario">
                        <label for="asunto">Asunto</label>
                        <input type="text" id="asunto" name="asunto" required placeholder="Asunto del mensaje">
                    </div>
                    <div class="grupo-formulario">
                        <label for="mensaje">Mensaje</label>
                        <textarea id="mensaje" name="mensaje" rows="5" required
                            placeholder="Escribe tu mensaje aquí..."></textarea>
                    </div>
                    <button type="submit" id="botonEnviar">Enviar Mensaje</button>
                    <div id="estadoFormulario"></div>
                </form>
            </div>
        </div>
    </main>
    <mobile-nav-bar></mobile-nav-bar>
    <footer>
        <footer-del-mate></footer-del-mate>
    </footer>

</body>

</html>
