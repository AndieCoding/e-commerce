<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Mis Datos - Configuración</title>
    <link rel="icon" type="image/x-icon" href="/img/icons/favicon.png">
    <link rel="stylesheet" href="/css/front.css">
    <link rel="stylesheet" href="/css/props.css" />
    <script type="module" src="/js/front/mis-datos.js"></script>
    <script type="module" src="/js/front/user-menu.js"></script>
    <link
        href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Roboto+Condensed:ital,wght@0,100..900;1,100..900&display=swap"
        rel="stylesheet">
    <script type="module" src="/js/components/navigation/mobile-nav-bar.js"></script>
</head>

<body>
    <menu-del-mate></menu-del-mate>

    <main class="user-panel">
        <div class="user-card" id="user-card-section" style="margin: 0 auto; max-width: 600px;">
            <div class="user-header">
                <img src="../img/icons/back-arrow.svg" alt="back-arrow" class="back-arrow">
                <h2>Mi Perfil</h2>
            </div>

            <form id="editar" class="user-form">
                <div class="profile-image-section">
                    <div class="image-container">
                        <div class="previewImage" id="previewImage"></div>
                        <div class="image-overlay">
                            <span class="camera-icon"><img class="edit-icon" src="/img/icons/upload.png"
                                    alt="Editar"></span>
                        </div>
                        <input type="file" id="fileInput" name="image" accept="image/*" hidden />
                    </div>
                    <button id="saveBtn" class="upload-btn">Guardar Nueva Foto</button>
                    <div id="uploadStatus"></div>
                </div>

                <div class="form-grid">
                    <div class="form-group">
                        <user-tools name="NOMBRE">
                            <label slot="label">Nombre</label>
                        </user-tools>
                    </div>

                    <div class="form-group">
                        <user-tools name="APELLIDO">
                            <label slot="label">Apellido</label>
                        </user-tools>
                    </div>

                    <div class="form-group">
                        <user-tools name="CIUDAD">
                            <label slot="label">Ciudad</label>
                        </user-tools>
                    </div>

                    <div class="form-group">
                        <user-tools name="EMAIL">
                            <label slot="label">Email</label>
                        </user-tools>
                    </div>

                    <div class="form-group full-width">
                        <user-tools name="PASSWORD">
                            <label slot="label">Contraseña</label>
                        </user-tools>
                    </div>
                </div>

                <div class="danger-zone">
                    <a id="eliminar_cuenta" class="delete-account-btn">Eliminar cuenta</a>
                </div>
            </form>
        </div>
    </main>
    <mobile-nav-bar></mobile-nav-bar>
    <footer>
        <footer-del-mate></footer-del-mate>
    </footer>
</body>

</html>
